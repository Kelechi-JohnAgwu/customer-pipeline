name: R Pipeline CI

on:
  push:
    branches:
      - master

permissions:
  id-token: write
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: arn:aws:iam::438424052683:role/GitHubActions-ECR-customer-pipeline
          aws-region: eu-north-1

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2
	
      - name: Set up R
        uses: r-lib/actions/setup-r@v2

      - name: Install R packages
        run: |
          Rscript -e 'install.packages(c("DBI", "RPostgres", "glue"))'

      - name: Check R script
        run: |
          Rscript -e 'parse(file = "R/pipeline.R")'

      - name: Build Docker image
        run: |
          docker build -t customer-pipeline .