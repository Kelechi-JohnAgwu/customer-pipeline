name: R Pipeline CI

on:
  push:
    branches:
      - master

permissions:
  id-token: write
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Inspect OIDC claims
        shell: bash
        run: |
          TOKEN_RESPONSE=$(curl -sS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=sts.amazonaws.com")
          TOKEN=$(echo "$TOKEN_RESPONSE" | python3 -c "import sys,json; print(json.load(sys.stdin)['value'])")
          PAYLOAD=$(echo "$TOKEN" | cut -d '.' -f2)
          PAYLOAD="${PAYLOAD//-/+}"
          PAYLOAD="${PAYLOAD//_/\/}"
          case $((${#PAYLOAD} % 4)) in
            2) PAYLOAD="${PAYLOAD}==" ;;
            3) PAYLOAD="${PAYLOAD}=" ;;
          esac
          echo "$PAYLOAD" | base64 -d | python3 -m json.tool

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: arn:aws:iam::438424052683:role/GitHubActions-ECR-customer-pipeline
          aws-region: eu-north-1

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: arn:aws:iam::438424052683:role/GitHubActions-ECR-customer-pipeline
          aws-region: eu-north-1

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up R
        uses: r-lib/actions/setup-r@v2

      - name: Install R packages
        run: |
          Rscript -e 'install.packages(c("DBI", "RPostgres", "glue"))'

      - name: Check R script
        run: |
          Rscript -e 'parse(file = "R/pipeline.R")'

      - name: Build Docker image
        run: |
          docker build -t customer-pipeline .

      - name: Tag Docker image
        run: |
          docker tag customer-pipeline:latest 438424052683.dkr.ecr.eu-north-1.amazonaws.com/kelechi-r-pipeline:latest

      - name: Push Docker image to ECR
        run: |
          docker push 438424052683.dkr.ecr.eu-north-1.amazonaws.com/kelechi-r-pipeline:latest