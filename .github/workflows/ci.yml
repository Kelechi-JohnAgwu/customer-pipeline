name: R Pipeline CI

on:
  push:
    branches:
      - master

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up R
        uses: r-lib/actions/setup-r@v2

      - name: Install R packages
        run: |
          Rscript -e 'install.packages(c("DBI", "RPostgres", "glue"))'

      - name: Check R script
        run: |
          Rscript -e 'parse(file = "R/pipeline.R")'

      - name: Build Docker image
        run: |
          docker build -t customer-pipeline .